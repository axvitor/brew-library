<script>
  // Applies the saved appearance before the stylesheet paints (app.js keeps it current).
  (function () {
    var c = 'auto';
    try { c = localStorage.getItem('brewTheme') || 'auto'; } catch (e) {}
    if (c === 'auto') c = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', c);
  })();
</script>
